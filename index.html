function el(tag,text,cls){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n;}
function numberField(parent,title,value,min,max,change){const label=el('label',title,'field'),input=el('input');input.type='number';input.value=value;input.min=min;input.max=max;input.step=1;let last=value;input.onchange=()=>{const n=Number(input.value);if(input.value===''||!Number.isInteger(n)||n<min||n>max){input.value=last;$('message').textContent=title+': '+min+'–'+max;return;}if(change(n)===false)input.value=last;else last=n;};label.append(input);parent.append(label);}
function inputField(parent,value,change,label){const x=el('input');x.value=value;x.maxLength=16;x.setAttribute('aria-label',label);x.onfocus=()=>x.select();x.onchange=()=>change(x.value);x.onkeydown=e=>{if(e.key==='Enter'&&!e.isComposing){e.preventDefault();x.onchange();const items=[...document.querySelectorAll('input[data-name]')],next=items[items.indexOf(x)+1];if(next){next.focus();next.select();}else x.blur();}};x.dataset.name='1';parent.append(x);return x;}
function select(parent,value,options,change,label){const x=el('select');x.setAttribute('aria-label',label);for(const [v,t]of options)x.add(new Option(t,v));x.value=String(value);x.onchange=()=>change(x.value);parent.append(x);return x;}
// Verified 18-color mapping from source colors in COLOR_PALETTE_18.snap; swatches sampled from WING-Edit screenshot.
function colorField(parent,row,change){const wrap=el('div',undefined,'wingColor colorPicker'),sw=el('span','','colorCode');const color=()=>wingPalette.find(c=>c.code===Number(row.col));function paint(){const c=color();sw.style.background=c?.hex||'#354052';sw.textContent='';wrap.title=c?.name||'Template';}paint();const options=wingPalette.map(c=>[c.code,c.name]);const picker=select(wrap,row.col,options,v=>{row.col=Number(v);paint();picker.setAttribute('aria-label','Warna WING: '+color().name);change?.();},'Warna WING: '+(color()?.name||'Template'));wrap.prepend(sw);parent.append(wrap);}
function table(parent,heads){const wrap=el('div',undefined,'tablewrap'),t=el('table'),thead=el('thead'),tr=el('tr');heads.forEach(h=>tr.append(el('th',h)));thead.append(tr);t.append(thead);const body=el('tbody');t.append(body);wrap.append(t);parent.append(wrap);return body;}
function cell(row,text){const td=el('td',text);row.append(td);return td;}
function outputSummary(){const groups=config.outputs.bus.slice(0,config.counts.bus).filter(x=>x.role==='group').length;return `${config.counts.bus} Mixbus (${groups} Group) · ${config.counts.main} Main · ${config.counts.mtx} Matrix`;}
function render(){const p=$('content');p.replaceChildren();$('stepTitle').textContent=titles[page];$('progress').replaceChildren();for(let i=0;i<titles.length;i++)$('progress').append(el('div',undefined,'step'+(i<=page?' on':'')));$('back').disabled=page===0;$('next').hidden=page===titles.length-1;$('download').hidden=page!==titles.length-1;$('message').textContent='';
if(page===0){const grid=el('div',undefined,'grid');p.append(grid);const name=el('label','Nama show','field');const inp=inputField(name,config.show,v=>config.show=v,'Nama show');inp.maxLength=64;inp.placeholder='BAND ABC';grid.append(name);const consoleLabel=el('label','Console','field');select(consoleLabel,'WING',[['WING','BEHRINGER WING']],()=>{},'Console');grid.append(consoleLabel);numberField(grid,'Jumlah input (1–40)',config.count,1,40,n=>{config.count=n;});const label=el('label','Quick Preset','field');const preset=select(label,'16',[[16,'Full Band 16 CH'],[24,'Full Band 24 CH'],[32,'Full Band 32 CH'],[40,'Full Band 40 CH']],()=>{},'Preset');p.append(label);const btn=el('button','Isi preset Full Band','secondary');btn.onclick=()=>{config.count=Number(preset.value);const names=['KICK','SNARE','HIHAT','TOM 1','TOM 2','OH L','OH R','BASS','GTR 1','GTR 2','KEY L','KEY R','VOX 1','VOX 2','PLAY L','PLAY R','PERC 1','PERC 2','AC GTR','GTR 3','KEY 2 L','KEY 2 R','VOX 3','VOX 4','CLICK','GUIDE','VOX 5','VOX 6','AMBI L','AMBI R'];config.channels.forEach((c,i)=>c.name=names[i]||'Ch '+String(i+1).padStart(2,'0'));render();};p.append(btn);p.append(el('h3','Jumlah Output'));p.append(el('p','Tentukan jumlah Mixbus yang digunakan. Mode Bus atau Group dipilih per Mixbus pada langkah konfigurasi output. Main dan Matrix dihitung terpisah.','muted'));const outputGrid=el('div',undefined,'grid');p.append(outputGrid);for(const [k,label,max]of [['bus','Jumlah Mixbus',16],['main','Jumlah Main',4],['mtx','Jumlah Matrix',8]])numberField(outputGrid,label,config.counts[k],0,max,n=>{config.counts[k]=n;renderCounts();});const summary=el('p',outputSummary(),'notice');summary.id='countsSummary';p.append(summary);p.append(el('p','Tidak perlu unggah template. Routing fisik mengikuti template dasar.','muted'));return;}

if(page===1){p.append(el('p','Label input, pilihan warna, dan mono/stereo tersedia langsung pada tabel. Stereo mengikuti sumber WING, tanpa menggabungkan dua strip seperti M32.','muted'));const body=table(p,['CH','Nama','Warna','Mono / Stereo']);for(let i=0;i<config.count;i++){const row=el('tr'),c=config.channels[i];cell(row,String(i+1).padStart(2,'0'));inputField(cell(row),c.name,v=>c.name=v,'Nama CH '+(i+1));colorField(cell(row),c);const source=base.ae_data.ch[i+1].in.conn;const current=config.sourceModes[c.source]||base.ae_data.io.in[source.grp]?.[source.in]?.mode||'M';select(cell(row),current,[['M','Mono'],['ST','Stereo']],v=>{config.sourceModes[c.source]=v;render();$('message').textContent='Mode sumber diterapkan pada semua channel yang memakai sumber yang sama.';},'Mode CH '+(i+1));body.append(row);}p.append(el('p','Ketuk kotak warna untuk memilih Blue, Red, Green, dan warna lainnya.','muted'));return;}
if(page===2){p.append(el('p','Pilih mode Bus atau Group pada setiap Mixbus. Mode Group otomatis memakai Feed Mode GROUP; mode Bus menyediakan PRE atau POST.','muted'));for(const kind of ['bus','main','mtx']){const entries=WingConfig.activeOutputs(config).filter(x=>x.kind===kind);if(!entries.length)continue;p.append(el('h3',kind==='bus'?'Mixbus':kind==='main'?'Main':'Matrix'));const body=table(p,kind==='bus'?['Mixbus','Nama','Warna','Mono / Stereo','Mode','Feed Mode']:['Output','Nama','Warna','Mono / Stereo']);for(const x of entries){const row=el('tr'),o=config.outputs[kind][x.index];cell(row,(kind==='bus'?'Mixbus':x.role)+' '+(x.index+1));inputField(cell(row),o.name,v=>o.name=v,'Nama output');colorField(cell(row),o);select(cell(row),o.mono?'M':'ST',[['M','Mono'],['ST','Stereo']],v=>o.mono=v==='M','Format output');if(kind==='bus'){select(cell(row),o.role,[['bus','Bus'],['group','Group']],v=>{WingConfig.setBusRole(o,v);render();},'Mode Mixbus '+(x.index+1));if(o.role==='group'){const feed=select(cell(row),'GRP',[['GRP','GROUP']],()=>{},'Feed mode Mixbus '+(x.index+1));feed.disabled=true;}else select(cell(row),o.mode,[['PRE','PRE'],['POST','POST']],v=>{o.mode=v;o.busMode=v;},'Feed mode Mixbus '+(x.index+1));}body.append(row);}}p.append(el('p','Feed mode tidak otomatis menyalakan send. Seluruh send mulai OFF. Group diarahkan ke Main 1 bila Main tersedia.','muted'));return;}
const toolbar=el('div',undefined,'grid');p.append(toolbar);select(toolbar,groupKind,[['dca','DCA'],['mgrp','Mute Group']],v=>{groupKind=v;groupIndex=0;render();},'Jenis grup');select(toolbar,groupIndex,config[groupKind].map((g,i)=>[i,g.name||String(i+1)]),v=>{groupIndex=Number(v);render();},'Pilih grup');const group=config[groupKind][groupIndex],label=el('label',groupKind==='dca'?'Nama DCA':'Nama Mute Group','field');inputField(label,group.name,v=>{group.name=v;},'Nama grup');p.append(label);const tools=el('div',undefined,'toolbar'),all=el('button','Pilih semua input','secondary'),none=el('button','Hapus pilihan grup ini','ghost');all.onclick=()=>{group.members=[...new Set([...group.members,...Array.from({length:config.count},(_,i)=>'ch:'+i)])];render();};none.onclick=()=>{group.members=[];render();};tools.append(all,none);p.append(tools);
function members(title,items){p.append(el('h3',title));const grid=el('div',undefined,'groupGrid');p.append(grid);for(const [key,text]of items){const label=el('label'),check=el('input');check.type='checkbox';check.checked=group.members.includes(key);check.onchange=()=>{group.members=group.members.filter(x=>x!==key);if(check.checked)group.members.push(key);};label.append(check,document.createTextNode(text));grid.append(label);}}
members('Input Channel',Array.from({length:config.count},(_,i)=>['ch:'+i,`CH ${i+1} · ${config.channels[i].name}`]));members('Output',WingConfig.activeOutputs(config).map(x=>[x.kind+':'+x.index,`${x.role} ${x.index+1} · ${config.outputs[x.kind][x.index].name}`]));p.append(el('p',`${config.count} input · ${outputSummary()}. Mute group tetap tidak aktif saat file dibuat.`,'muted'));
}
function renderCounts(){const node=$('countsSummary');if(node)node.textContent=outputSummary();}
$('next').onclick=()=>{try{WingConfig.validate(config);page=Math.min(titles.length-1,page+1);render();window.scrollTo(0,0);}catch(e){$('message').textContent=e.message;}};
$('back').onclick=()=>{page=Math.max(0,page-1);render();window.scrollTo(0,0);};
$('reset').onclick=()=>{if(!confirm('Reset semua konfigurasi show?'))return;config=WingConfig.newConfig(base);page=0;groupIndex=0;render();};
$('download').onclick=()=>{try{const out=WingConfig.compile(base,config),name=WingConfig.snapshotFilename(config.show);const url=URL.createObjectURL(new Blob([JSON.stringify(out,null,2)],{type:'application/octet-stream'})),a=el('a');a.href=url;a.download=name;a.style.display='none';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);$('message').textContent='File '+name+' sudah dikirim ke unduhan. Periksa di WING-Edit.';}catch(e){$('message').textContent=e.message;}};

'use strict';
let editKind='ch',editIndex=0,editBus=1;
let outputEdit=0;
function databaseControls(parent){
 if(page===0){const area=el('div',undefined,'grid');numberField(area,'Jumlah AUX (0–8)',config.auxCount,0,8,n=>config.auxCount=n);parent.insertBefore(area,parent.querySelector('h3'));return;}
 if(page===2&&config.counts.bus){if(outputEdit>=config.counts.bus)outputEdit=0;const details=el('details');details.id='busSettings';details.append(el('summary','Pengaturan Bus & Main'));parent.append(details);select(details,outputEdit,Array.from({length:config.counts.bus},(_,i)=>[i,'Mixbus '+(i+1)+' · '+config.outputs.bus[i].name]),v=>{outputEdit=Number(v);render();$('busSettings').open=true;},'Bus pengaturan');const row=config.outputs.bus[outputEdit],grid=el('div',undefined,'grid');details.append(grid);for(const[key,title,initial]of [['eqEnabled','EQ Bus',false],['muted','Mute Bus',false],...(config.counts.main?[['main1','Assign Bus ke Main 1',row.role==='group']]:[])]){const label=el('label',title,'field');select(label,String(row[key]??initial),[['false','OFF'],['true','ON']],v=>row[key]=v==='true',title);grid.append(label);}return;}
 if(page!==1)return;
 if(config.auxCount){parent.append(el('h3','AUX Input'));const body=table(parent,['AUX','Nama','Warna']);for(let i=0;i<config.auxCount;i++){const tr=el('tr'),row=config.aux[i];cell(tr,String(i+1));inputField(cell(tr),row.name,v=>row.name=v,'Nama AUX '+(i+1));colorField(cell(tr),row);body.append(tr);}}
 const details=el('details');details.id='inputSettings';details.append(el('summary','Pengaturan input & send'));parent.append(details);
 details.append(el('p','Pilih input untuk mengatur pemrosesan dasar, Main, dan send. Routing mengikuti template.','muted'));
 const toolbar=el('div',undefined,'grid');details.append(toolbar);
 if(editKind==='aux'&&!config.auxCount){editKind='ch';editIndex=0;}const total=editKind==='ch'?config.count:config.auxCount;if(editIndex>=total)editIndex=0;
 function refresh(){render();$('inputSettings').open=true;}
 select(toolbar,editKind,config.auxCount?[['ch','Channel'],['aux','AUX']]:[['ch','Channel']],v=>{editKind=v;editIndex=0;refresh();},'Jenis input pengaturan');
 select(toolbar,editIndex,Array.from({length:total},(_,i)=>[i,(editKind==='ch'?'CH ':'AUX ')+(i+1)+' · '+(editKind==='ch'?config.channels[i].name:config.aux[i].name)]),v=>{editIndex=Number(v);refresh();},'Input pengaturan');
 const key=editKind+':'+editIndex;let grid=el('div',undefined,'grid');details.append(grid);
 const read=field=>WingConfig.readSetting(base,config,key,field),write=(field,value)=>WingConfig.writeSetting(config,key,field,value);
 function toggle(title,field){const label=el('label',title,'field');select(label,String(read(field)),[['false','OFF'],['true','ON']],v=>write(field,v==='true'),title);grid.append(label);}
 function numeric(title,field,min,max){const label=el('label',title,'field'),input=el('input');input.type='number';input.step='any';input.min=min;input.max=max;input.value=read(field);input.setAttribute('aria-label',title);input.onchange=()=>{try{if(input.value.trim()==='')throw Error('Isi nilai '+title);write(field,Number(input.value));$('message').textContent='';}catch(e){input.value=read(field);$('message').textContent=e.message;}};label.append(input);grid.append(label);}
 toggle('Mute input','mute');numeric('Fader input (dB)','fdr',-144,10);numeric('Pan input','pan',-100,100);toggle('EQ input','eq.on');
 if(editKind==='ch'){toggle('HPF input','flt.lc');numeric('HPF (Hz)','flt.lcf',20,20000);toggle('Gate input','gate.on');toggle('Compressor input','dyn.on');numeric('Trim input (dB)','in.set.trim',-18,18);toggle('Polarity invert','in.set.inv');toggle('Delay input','in.set.dlyon');const label=el('label','Delay (ms)','field'),n=el('input');n.type='number';n.step='any';n.min=0;n.max=500;n.value=read('in.set.dlymode')==='MS'?read('in.set.dly'):'';n.placeholder='Isi untuk memakai ms';n.setAttribute('aria-label','Delay (ms)');n.onchange=()=>{try{if(n.value.trim()==='')throw Error('Isi delay dalam ms.');write('in.set.dly',Number(n.value));write('in.set.dlymode','MS');}catch(e){$('message').textContent=e.message;}};label.append(n);grid.append(label);}
 for(let i=1;i<=config.counts.main;i++)toggle('Assign Main '+i,'main.'+i+'.on');
 if(!config.counts.bus)return;
 const busLabel=el('label','Tujuan send','field');details.append(busLabel);if(editBus>config.counts.bus)editBus=1;select(busLabel,editBus,Array.from({length:config.counts.bus},(_,i)=>[i+1,'Mixbus '+(i+1)+' · '+config.outputs.bus[i].name]),v=>{editBus=Number(v);refresh();},'Tujuan send');
 grid=el('div',undefined,'grid');details.append(grid);const prefix='send.'+editBus+'.';toggle('Send enable',prefix+'on');numeric('Send level (dB)',prefix+'lvl',-144,10);numeric('Send pan',prefix+'pan',-100,100);
 if(config.outputs.bus[editBus-1].role==='group'){details.append(el('p','Tujuan memakai mode GROUP.','muted'));}else{const label=el('label','Send mode','field');select(label,read(prefix+'mode'),[['PRE','PRE'],['POST','POST']],v=>{write(prefix+'mode',v);refresh();},'Send mode');grid.append(label);}
 if(editKind==='ch'){const label=el('label','Send pan link','field');select(label,read(prefix+'plink'),[[0,'Independent'],[1,'Link CH pan'],[2,'Link reversed']],v=>{const link=Number(v),pan=read('pan');write(prefix+'plink',link);if(link)write(prefix+'pan',link===2?-pan:pan);},'Send pan link');grid.append(label);if(read(prefix+'mode')==='PRE')toggle('Ignore channel mute',prefix+'pon');}
}
const originalRender=render;
render=function(){originalRender();databaseControls($('content'));};

render();</script></body></html>
